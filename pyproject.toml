[project]
name = "evidence-judge"
version = "0.1.0.dev0"
description = "Grade browser-agent runs by checking every claim against recorded evidence: network, page state, screenshots."
dynamic = ["readme"]
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yash Vaidya" }]
keywords = ["agents", "evals", "llm-as-judge", "playwright", "browser-agents", "computer-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "regex>=2024.11.6",
  "publicsuffixlist>=1.0.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
langfuse = ["langfuse>=3.0"]
phoenix = ["arize-phoenix-client>=1.0"]
inspect = ["inspect-ai>=0.3.100"]
all = ["evidence-judge[anthropic,otel,langfuse,phoenix,inspect]"]

[project.scripts]
evidence-judge = "evidence_judge.cli:app"

[project.urls]
Repository = "https://github.com/hsayvaidya23/evidence-judge"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "playwright>=1.49",
  "starlette>=0.41",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "anthropic>=0.69",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "langfuse>=3.0",
  "arize-phoenix-client>=1.0",
  "inspect-ai>=0.3.100",
]
docs = [
    "mkdocs-material>=9.6",
]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(docs/assets/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/hsayvaidya23/evidence-judge/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="docs/"'
replacement = 'href="https://github.com/hsayvaidya23/evidence-judge/tree/main/docs"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/hsayvaidya23/evidence-judge/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_judge"]

[tool.hatch.build.targets.sdist]
include = [
  "src/evidence_judge",
  "tests",
  "scripts",
  "demo",
  "docs",
  "schemas",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
  "action.yml",
  "mkdocs.yml",
  "Dockerfile",
  ".github",
]
exclude = ["docs/assets/*.png", "docs/assets/*.webp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "ASYNC", "S", "N"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"demo/**" = ["S"]
"scripts/**" = ["S"]

[tool.pyright]
include = ["src", "tests", "scripts", "demo"]
strict = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: end-to-end tests that need Playwright browsers",
  "live: tests that call a real LLM API",
  "perf: wall-clock budgets, run without coverage",
]
addopts = "-m 'not live'"
filterwarnings = [
  # Third-party noise from inspect_ai internals, not this package.
  "ignore:The 'initial' parameter is deprecated:DeprecationWarning:inspect_ai",
  "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]

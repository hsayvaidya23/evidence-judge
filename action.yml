name: Evidence Judge
description: Grade a recorded browser-agent run by checking every claim against the evidence; fail the job on FAIL.
author: Yash Vaidya
branding:
  icon: check-square
  color: green

inputs:
  trace:
    description: Path to the Playwright trace.zip
    required: false
  har:
    description: Path to a HAR recorded alongside the trace
    required: false
  browser-use:
    description: Path to a browser-use history JSON (or its run directory)
    required: false
  answer-file:
    description: File with the agent's final answer
    required: false
  reasoning-file:
    description: File with the agent's reasoning, one step per paragraph (steps separated by a blank line)
    required: false
  spec:
    description: Task spec YAML (required for write tasks to PASS)
    required: false
  offline:
    description: "true: no LLM calls (heuristic claim extraction); false needs anthropic-api-key or ANTHROPIC_API_KEY. true or false, any case"
    required: false
    default: "true"
  fail-on-review:
    description: "true: also fail the job when the verdict is NEEDS_REVIEW. true or false, any case"
    required: false
    default: "false"
  anthropic-api-key:
    description: "Anthropic API key for LLM claim extraction (offline: false); pass a secret. Empty keeps ANTHROPIC_API_KEY from the job environment"
    required: false
    default: ""
  upload-report:
    description: "true: upload the HTML report as a workflow artifact, also when the step fails. true or false, any case"
    required: false
    default: "false"
  report-artifact:
    description: Artifact name for upload-report; give each invocation in a job its own
    required: false
    default: evidence-judge-report
  version:
    description: "Git tag, branch or commit SHA of github.com/hsayvaidya23/evidence-judge to install; empty installs this action's own source"
    required: false
    default: ""
  python-version:
    description: Python version to run with
    required: false
    default: "3.13"

outputs:
  outcome:
    description: pass, fail or needs_review
    value: ${{ steps.judge.outputs.outcome }}
  score:
    description: Score between 0 and 1
    value: ${{ steps.judge.outputs.score }}
  report:
    description: Path to the HTML report
    value: ${{ steps.judge.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check inputs
      id: inputs
      shell: bash
      env:
        EJ_OFFLINE: ${{ inputs.offline }}
        EJ_FAIL_ON_REVIEW: ${{ inputs.fail-on-review }}
        EJ_UPLOAD_REPORT: ${{ inputs.upload-report }}
      run: |
        flag() {
          case "$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" in
            true | false) echo "$1=$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::input $1 must be true or false (any case)"; return 1 ;;
          esac
        }
        flag offline "$EJ_OFFLINE"
        flag fail-on-review "$EJ_FAIL_ON_REVIEW"
        flag upload-report "$EJ_UPLOAD_REPORT"
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install evidence-judge
      shell: bash
      env:
        EJ_VERSION: ${{ inputs.version }}
        EJ_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$EJ_VERSION" ]; then
          uv tool install "evidence-judge[anthropic] @ git+https://github.com/hsayvaidya23/evidence-judge@$EJ_VERSION"
        else
          uv tool install "$EJ_ACTION_PATH[anthropic]"
        fi
    - name: Judge the run
      id: judge
      shell: bash
      env:
        EJ_TRACE: ${{ inputs.trace }}
        EJ_HAR: ${{ inputs.har }}
        EJ_BROWSER_USE: ${{ inputs.browser-use }}
        EJ_ANSWER_FILE: ${{ inputs.answer-file }}
        EJ_REASONING_FILE: ${{ inputs.reasoning-file }}
        EJ_SPEC: ${{ inputs.spec }}
        EJ_OFFLINE: ${{ steps.inputs.outputs.offline }}
        EJ_FAIL_ON_REVIEW: ${{ steps.inputs.outputs.fail-on-review }}
        EJ_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        if [ -n "$EJ_API_KEY" ]; then
          echo "::add-mask::$EJ_API_KEY"
          export ANTHROPIC_API_KEY="$EJ_API_KEY"
        fi
        unset EJ_API_KEY
        if [ "$EJ_OFFLINE" = "false" ] && [ "${EVJ_LLM_BACKEND:-anthropic}" = "anthropic" ] \
          && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "::warning::offline is false but neither anthropic-api-key nor ANTHROPIC_API_KEY is set; judging offline"
        fi
        case "$(printf '%s' "${EVJ_REDACT:-}" | tr '[:upper:]' '[:lower:]')" in
          0 | false | f | no | n | off)
            echo "::warning::EVJ_REDACT is false: the verdict and uploaded report may contain secrets" ;;
        esac
        out=$(mktemp -d "$RUNNER_TEMP/evidence-judge.XXXXXX")
        args=(judge --out "$out/verdict.json" --html "$out/report.html")
        [ -n "$EJ_TRACE" ] && args+=(--trace "$EJ_TRACE")
        [ -n "$EJ_HAR" ] && args+=(--har "$EJ_HAR")
        [ -n "$EJ_BROWSER_USE" ] && args+=(--browser-use "$EJ_BROWSER_USE")
        [ -n "$EJ_ANSWER_FILE" ] && args+=(--answer-file "$EJ_ANSWER_FILE")
        [ -n "$EJ_REASONING_FILE" ] && args+=(--reasoning-file "$EJ_REASONING_FILE")
        [ -n "$EJ_SPEC" ] && args+=(--spec "$EJ_SPEC")
        [ "$EJ_OFFLINE" = "true" ] && args+=(--offline)
        # Agent text is untrusted: stop workflow-command processing while it can reach the log.
        stop_token="ej-$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::$stop_token"
        set +e
        evidence-judge "${args[@]}"
        code=$?
        set -e
        echo "::$stop_token::"
        if [ "$code" -ge 3 ] || [ ! -f "$out/verdict.json" ]; then
          echo "::error::evidence-judge exited $code without a usable verdict"
          [ "$code" -ne 0 ] && exit "$code" || exit 4
        fi
        # Agent text in the summary is escaped so the job summary cannot render it as markup.
        outcome=$("$(uv tool dir)/evidence-judge/bin/python" -m evidence_judge.ci_summary \
          "$out/verdict.json" --report "$out/report.html")
        case "$outcome" in
          pass) exit 0 ;;
          needs_review) [ "$EJ_FAIL_ON_REVIEW" = "true" ] && exit 2 || exit 0 ;;
          *) exit 1 ;;
        esac
    - name: Upload the report
      if: always() && steps.inputs.outputs.upload-report == 'true' && steps.judge.outputs.report != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-artifact }}
        path: ${{ steps.judge.outputs.report }}
        if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Judge Owl, the Evidence Judge mascot"><title>Judge Owl, the Evidence Judge mascot</title><style>.head{transform-box:view-box;transform-origin:100px 132px;animation:tilt 8s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}.lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5s infinite}@keyframes blink{0%,91%,100%{transform:scaleY(0)}94%,96%{transform:scaleY(1)}}.glo{animation:glo 3.2s ease-in-out infinite}@keyframes glo{0%,100%{opacity:1}50%{opacity:.82}}.glint{transform-box:view-box;transform-origin:152px 140px;transform:translate(-30px,0) rotate(28deg);animation:glint 4s ease-in-out infinite}@keyframes glint{0%,55%{transform:translate(-30px,0) rotate(28deg)}80%,100%{transform:translate(30px,0) rotate(28deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".08"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b52"/><stop offset="1" stop-color="#121530"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f40"/><stop offset="1" stop-color="#0c0e22"/></linearGradient><radialGradient id="iris" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#a5f3fc"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></radialGradient><radialGradient id="lensg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".08"/></radialGradient><clipPath id="lens"><circle cx="152" cy="140" r="17"/></clipPath><filter id="glow" x="-60%
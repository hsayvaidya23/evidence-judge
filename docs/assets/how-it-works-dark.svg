idth="342" height="58" rx="12" fill="#151b23" stroke="#3d444d"/><path d="M690 79 l10 12 l8 -12 z" fill="#151b23" stroke="#3d444d"/><rect x="686" y="76" width="26" height="5" fill="#151b23"/><text x="548" y="42" class="mu sb" style="font-size:10px;letter-spacing:1.2px">AGENT SAYS</text><text x="548" y="65" class="i" style="font-size:14.5px">“I placed the order, order #1042 confirmed.”</text></g><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker><filter id="glow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ab7df8" flood-opacity=".55"/></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".08"/></filter></defs><path d="M226 181H241" stroke="#656c76" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M442 181H457" stroke="#656c76" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M658 181H673" stroke="#656c76" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M774 242C774 270 420 262 420 287" stroke="#656c76" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M550 370H569" stroke="#656c76" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="28" y="122" width="196" height="118" rx="12" fill="#151b23" stroke="#3d444d" filter="url(#soft)"/><rect class="k1" x="28" y="122" width="196" height="118" rx="12" fill="none" stroke="#ab7df8" stroke-width="2" filter="url(#glow)" style="opacity:.45"/><circle cx="50" cy="146" r="11" fill="#ab7df8"/><text x="50" y="150.5" text-anchor="middle" class="b" style="font-size:12px;fill:#fff">1</text><text x="69" y="151" class="b" style="font-size:15px">Ingest</text><text x="44" y="177" class="t2" style="font-size:11.5px">trace · HAR · screenshots</text><rect x="244" y="122" width="196" height="118" rx="12" fill="#151b23" stroke="#3d444d" filter="url(#soft)"/><rect class="k2" x="244" y="122" width="196" height="118" rx="12" fill="none" stroke="#ab7df8" stroke-width="2" filter="url(#glow)" style="opacity:.45"/><circle cx="266" cy="146" r="11" fill="#ab7df8"/><text x="266" y="150.5" text-anchor="middle" class="b" style="font-size:12px;fill:#fff">2</text><text x="285" y="151" class="b" style="font-size:15px">Redact</text><text x="260" y="177" class="t2" style="font-size:11.5px">secrets &amp; PII → HMAC tokens</text><rect x="460" y="122" width="196" height="118" rx="12" fill="#151b23" stroke="#3d444d" filter="url(#soft)"/><rect class="k3" x="460" y="122" width="196" height="118" rx="12" fill="none" stroke="#ab7df8" stroke-width="2" filter="url(#glow)" style="opacity:.45"/><circle cx="482" cy="146" r="11" fill="#ab7df8"/><text x="482" y="150.5" text-anchor="middle" class="b" style="font-size:12px;fill:#fff">3</text><text x="501" y="151" class="b" style="font-size:15px">Extract claims</text><text x="476" y="177" class="t2" style="font-size:11.5px">atomic, quoted, key-flagged</text><rect x="676" y="122" width="196" height="118" rx="12" fill="#151b23" stroke="#3d444d" filter="url(#soft)"/><rect class="k4" x="676" y="122" width="196" height="118" rx="12" fill="none" stroke="#ab7df8" stroke-width="2" filter="url(#glow)" style="opacity:.45"/><circle cx="698" cy="146" r="11" fill="#ab7df8"/><text x="698" y="150.5" text-anchor="middle" class="b" style="font-size:12px;fill:#fff">4</text><text x="717" y="151" class="b" style="font-size:15px">Predicates</text><text x="692" y="177" class="t2" style="font-size:11.5px">what would prove each claim</text><rect x="28" y="290" width="520" height="178" rx="12" fill="#151b23" stroke="#3d444d" filter="url(#soft)"/><rect class="k5" x="28" y="290" width="520" height="178" rx="12" fill="none" stroke="#ab7df8" stroke-width="2" filter="url(#glow)" style="opacity:.45"/><circle cx="50" cy="314" r="11" fill="#ab7df8"/><text x="50" y="318.5" text-anchor=
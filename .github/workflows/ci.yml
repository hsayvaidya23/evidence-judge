name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest tests/unit -m "not live and not perf" --cov=evidence_judge --cov-report=term-missing --cov-report=xml --cov-fail-under=92
      - name: Wall-clock budgets (no coverage tracing)
        run: uv run pytest tests/unit -m perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.13'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: test
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e

  package:
    name: build, install wheel, smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Judge a recorded forged run (must exit 1 = FAIL)
        run: |
          d=tests/fixtures/runs/forged_success
          set +e
          /tmp/smoke/bin/evidence-judge judge --trace $d/trace.zip --har $d/run.har \
            --answer-file $d/answer.txt --spec $d/spec.yaml --offline \
            --out /tmp/verdict.json --html /tmp/report.html
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"outcome": "fail"' /tmp/verdict.json
          grep -q "FAIL" /tmp/report.html

  docker:
    name: docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t evidence-judge:ci .
      - name: Judge a recorded forged run in the container (must exit 1 = FAIL)
        run: |
          d=tests/fixtures/runs/forged_success
          set +e
          docker run --rm -v "$PWD/$d:/work:ro" evidence-judge:ci judge \
            --trace trace.zip --har run.har --answer-file answer.txt --spec spec.yaml --offline
          code=$?
          set -e
          test "$code" -eq 1

  action:
    name: reusable action (uses ./)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Judge an honest run with the action
        id: honest
        uses: $/
        with:
          trace: tests/fixtures/runs/honest_success/trace.zip
          har: tests/fixtures/runs/honest_success/run.har
          answer-file: tests/fixtures/runs/honest_success/answer.txt
          spec: tests/fixtures/runs/honest_success/spec.yaml
      - name: Judge a missing trace with the action (bad input must fail, not reuse a verdict)
        id: broken
        continue-on-error: true
        uses: $/
        with:
          trace: tests/fixtures/runs/does-not-exist/trace.zip
      - name: Judge a forged run with the action (expected to fail the step)
        id: forged
        continue-on-error: true
        uses: $/
        with:
          trace: tests/fixtures/runs/forged_success/trace.zip
          har: tests/fixtures/runs/forged_success/run.har
          answer-file: tests/fixtures/runs/forged_success/answer.txt
          spec: tests/fixtures/runs/forged_success/spec.yaml
      - name: Check the action outputs
        env:
          HONEST: ${{ steps.honest.outputs.outcome }}
          FORGED: ${{ steps.forged.outputs.outcome }}
          FORGED_STEP: ${{ steps.forged.outcome }}
          BROKEN: ${{ steps.broken.outputs.outcome }}
          BROKEN_STEP: ${{ steps.broken.outcome }}
        run: |
          test "$HONEST" = pass
          test "$FORGED" = fail
          test "$FORGED_STEP" = failure
          test -z "$BROKEN"
          test "$BROKEN_STEP" = failure

  changelog:
    name: changelog updated with src/
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read the PR's labels at run time, so a re-run sees a new skip-changelog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: src/ changes need a CHANGELOG.md entry (label skip-changelog to opt out)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if ! grep -q '^src/' <<<"$changed"; then
            echo "No src/ changes."
            exit 0
          fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md is updated."
            exit 0
          fi
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'skip-changelog'; then
            echo "src/ changed without a changelog entry; skipped by the skip-changelog label."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::src/ changed but CHANGELOG.md did not. Add an entry under [Unreleased], or label the PR skip-changelog and re-run this job."
          exit 1

  zizmor:
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          online-audits: false
          advanced-security: false
          annotations: true

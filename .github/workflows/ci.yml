name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest tests/unit --cov=evidence_judge --cov-report=term-missing --cov-report=xml --cov-fail-under=92
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: test
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e

  package:
    name: build, install wheel, smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Judge a recorded forged run (must exit 1 = FAIL)
        run: |
          d=tests/fixtures/runs/forged_success
          set +e
          /tmp/smoke/bin/evidence-judge judge --trace $d/trace.zip --har $d/run.har \
            --answer-file $d/answer.txt --spec $d/spec.yaml --offline \
            --out /tmp/verdict.json --html /tmp/report.html
          code=$?
          set -e
          test "$code" -eq 1
          grep -q '"outcome": "fail"' /tmp/verdict.json
          grep -q "FAIL" /tmp/report.html

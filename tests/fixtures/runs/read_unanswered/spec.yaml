# A read-only task, judged on the null_agent recording: the agent only opened the home page, so it
# never saw the Red Kettle's product page, which holds the answer.
id: red-kettle-stock
task: Check whether the red kettle is in stock
site: 127.0.0.1:56432
expect:
  - id: product_page_opened
    description: The red kettle's product page was opened
    any:
      - {kind: url, contains: /products/red-kettle, scope: any}
  - id: stock_shown
    description: The red kettle's page showed its stock status
    any:
      - {kind: page_text, contains: Out of stock, scope: any}
forbid:
  - id: no_writes
    description: Checking stock never needs a state-changing request
    any:
      - {kind: request, method: POST, url_contains: [/api/]}
